name: CI

on:
  push:
  pull_request:

jobs:
  freebsd-build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: 'freebsd'
          version: '15.1'
          architecture: 'x86_64'
          run: |
            # Use latest package set
            sudo mkdir -p /usr/local/etc/pkg/repos/
            sudo cp /etc/pkg/FreeBSD.conf /usr/local/etc/pkg/repos/FreeBSD.conf
            sudo sed -i.bak -e 's|/quarterly|/latest|' /usr/local/etc/pkg/repos/FreeBSD.conf

            # Install deps
            sudo -E pkg install -y \
                evdev-proto meson ninja pkgconf

            # Run the build
            env CPPFLAGS='-isystem /usr/local/include' CFLAGS='-isystem /usr/local/include' meson _build
            ninja -v -C _build
  dragonfly-build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: 'dragonflybsd'
          version: '6.4.2'
          architecture: 'x86_64'
          run: |
            # Install deps
            sudo -E pkg install -y evdev-proto meson ninja pkgconf

            # Run the build
            env CPPFLAGS='-isystem /usr/local/include' CFLAGS='-isystem /usr/local/include' meson _build
            ninja -v -C _build
  netbsd-build:
    runs-on: ubuntu-latest
    env:
      NETBSD_VERSION: '11.0'
    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: 'netbsd'
          version: '${{ env.NETBSD_VERSION }}'
          architecture: 'x86_64'

      - name: Build on NetBSD
        shell: cpa.sh {0}
        run: |
          # Set PKG_PATH for package repository
          export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/amd64/$NETBSD_VERSION/All"

          # Install deps
          sudo -E pkg_add -v meson ninja-build pkgconf ndevd

          # Run the build
          env CPPFLAGS='-isystem /usr/pkg/include' CFLAGS='-isystem /usr/pkg/include' meson _build
          ninja -v -C _build

  openbsd-build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: 'openbsd'
          version: '7.8'
          architecture: 'x86_64'
          run: |
            # Install deps
            sudo -E pkg_add -v  meson ninja pkgconf

            # Run the build
            env CPPFLAGS='-isystem /usr/local/include' CFLAGS='-isystem /usr/local/include' meson _build
            ninja -v -C _build
